name: Gemini Content Moderator

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  moderate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Run Gemini Moderator
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Analyze the following GitHub text for toxic behavior, hostile personal attacks, or harassment:
            "${{ github.event.comment.body || github.event.issue.body }}"
            
            CONTEXT: The repository owner openly acknowledges using AI to build this project. Neutral mentions, questions, or facts about AI being used are completely fine and must NOT be flagged.
            
            If it contains a severe violation, output "FLAGGED". Otherwise, output "OK".
