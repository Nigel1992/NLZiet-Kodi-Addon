name: Comment Moderation Check

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

jobs:
  moderate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Moderation Check
        uses: google-github-actions/run-gemini-cli@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          prompt: |
            Analyze the following text posted on GitHub.
            
            CONTEXT: The repository owner openly acknowledges using AI to build this project. Simply mentioning that AI is used is fine.
            
            CRITERIA FOR FLAGGING: Flag the content if it contains:
            1. Condescending remarks, dismissive language, or insults targeting the repository owner's intelligence, technical ability, or competence (e.g., claiming the developer "has no clue what they are doing" or belittling them by saying an AI does all the work).
            2. Toxic, hostile language, personal insults, harassment, or malicious attacks.
            
            If it meets these criteria, reply strictly with: [FLAGGED] followed by a short reason. Otherwise, reply with: [OK].
            
            Text to analyze:
            ${{ github.event.comment.body || github.event.issue.body }}
